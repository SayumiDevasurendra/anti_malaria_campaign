# AMC Malaria Slide Quality Grading Configuration

# Project Metadata
project:
  name: "AMC Malaria Slide Quality Grading"
  version: "0.1.0"
  description: "AI-based slide quality grading and optimal Giemsa staining time prediction"

# Data Configuration
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  annotations_dir: "data/annotations"

  # Image specifications
  image_size: [512, 512]  # Target size for model input
  channels: 3

  # Staining protocols
  dilutions:
    - "10%"  # Rapid method: 5-15 minutes
    - "3%"   # Slow method: 30-45 minutes

  time_ranges:
    "10%": [5, 15]  # minutes
    "3%": [30, 45]  # minutes

  # Smear types
  smear_types:
    - "thin"
    - "thick"

  # AMC Grade scale
  grades:
    labels: ["I", "II", "III", "IV", "V"]
    numeric: [1, 2, 3, 4, 5]
    pass_threshold: 3  # Grade III is minimum acceptable

  # Reason codes for failures
  failure_reasons:
    - "under_stain"
    - "over_stain"
    - "precipitates"
    - "ph_rinse_issue"
    - "fixation_problem"
    - "background_artefacts"

  # Train/Val/Test split
  split_ratios:
    train: 0.7
    val: 0.15
    test: 0.15

  random_seed: 42

# Model Configuration
model:
  # Architecture choices: resnet18, resnet50, efficientnet_b0, mobilenet_v3_small
  architecture: "resnet18"
  pretrained: true

  # Outputs
  num_grade_classes: 5  # Grades I-V
  num_reason_classes: 6  # Multi-label failure reasons

  # Dropout for regularization
  dropout: 0.3

  # Model paths
  save_dir: "models"
  checkpoint_dir: "checkpoints"

# Training Configuration
training:
  # Hyperparameters
  batch_size: 16
  num_epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001

  # Optimizer
  optimizer: "adam"  # adam, sgd, adamw

  # Learning rate scheduler
  scheduler:
    type: "cosine"  # step, cosine, plateau
    warmup_epochs: 5

  # Loss weights (for multi-task learning)
  loss_weights:
    grade: 1.0
    reason: 0.5

  # Early stopping
  early_stopping:
    patience: 10
    min_delta: 0.001

  # Checkpointing
  save_best_only: true
  save_frequency: 5  # epochs

  # Mixed precision training
  use_amp: true

# Data Augmentation
augmentation:
  train:
    # Geometric
    random_rotation: 15  # degrees
    random_horizontal_flip: 0.5
    random_vertical_flip: 0.5

    # Color (conservative for stain preservation)
    brightness_jitter: 0.1
    contrast_jitter: 0.1
    saturation_jitter: 0.05
    hue_jitter: 0.02

    # Noise
    gaussian_blur_prob: 0.1
    gaussian_noise_prob: 0.1

  val:
    # No augmentation for validation
    pass

# Stain Normalization
stain_normalization:
  enabled: true
  method: "macenko"  # macenko, vahadane, reinhard
  reference_image: null  # Path to reference image, null for auto
  conservative: true  # Preserve diagnostic colors

# Evaluation
evaluation:
  metrics:
    - "accuracy"
    - "cohen_kappa"
    - "precision"
    - "recall"
    - "f1_score"
    - "confusion_matrix"

  # Grade prediction confidence threshold
  confidence_threshold: 0.7

  # Cross-validation
  cross_validation:
    enabled: false
    n_folds: 5

# Optimal Time Selection
optimal_time:
  # Confidence threshold for "pass" (Grade >= 3)
  pass_confidence_threshold: 0.8

  # Minimum stability window (consecutive acceptable minutes)
  stability_window: 2  # minutes

  # Aggregation across FOVs
  min_fovs_per_slide: 3
  agreement_threshold: 0.7  # Fraction of FOVs that must agree

# Geospatial Pattern Mapping
geospatial:
  enabled: true
  interpolation_method: "idw"  # idw, gaussian_process, kriging
  uncertainty_bands: true
  visualization_tool: "folium"  # folium, qgis_export

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_dir: "logs"
  tensorboard_dir: "runs"
  console_output: true
  file_output: true

# Hardware
hardware:
  device: "cuda"  # cuda, cpu, mps (for Mac)
  num_workers: 4  # DataLoader workers
  pin_memory: true

# Reproducibility
reproducibility:
  seed: 42
  deterministic: true
  benchmark: false
